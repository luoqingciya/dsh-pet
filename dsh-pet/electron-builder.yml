# electron-builder 配置 —— 只用来产出 Windows 安装版（NSIS）
#
# 免安装版不走这里：`scripts/package-app.mjs` 直接拷一份 Electron 运行时即可（更快、更可控）。
# 这里之所以引入 electron-builder，是因为 NSIS 安装包（向导、开始菜单、卸载项、per-user 安装）
# 自己实现不划算。
#
# 关键取舍：
#   - `asar: false`：桌面 Helper 是以**子进程 + 脚本路径**拉起的（`dsh-pet.exe runtime/electron-helper/main.js`），
#     打进 asar 后那条路径不再是一个可执行的脚本文件。不压缩换取"能跑"。
#   - `perMachine: false`：装到 `%LOCALAPPDATA%\Programs\dsh-pet`，当前用户可写 ——
#     应用的配置/素材/日志就落在 `<安装目录>/data`（见 src/app/main.ts 的 resolveDataRoot）。
#     装到 Program Files 会因不可写而回落用户目录，就不是"数据都在安装目录下"了。
#   - 只发 x64：与 CI 的便携版一致；arm64 等有人需要再加。
appId: com.luoqingciya.dsh-pet
productName: dsh-pet
copyright: MIT

# 与 scripts/package-app.mjs 用的是同一份 Electron；版本必须显式声明（本包不把 electron 当依赖装）
electronVersion: 43.3.0

asar: false
directories:
  output: dist/installer

# 只保留中文与英文语言包：Electron 默认带 55 个 locale（47MB），
# 一个中文桌宠只需要 zh-CN + en-US，裁剪后省 ~45MB。
electronLanguages:
  - zh-CN
  - en-US

# 只打运行必需的文件（与 package.json 的 files 口径一致）
# node_modules 明确排除：主进程与设置页都已被打包成单文件，运行时不需要任何 npm 依赖
# （启动器才需要 @electron/get，而安装版根本不经过启动器）。
files:
  - lib/**/*
  - runtime/**/*
  - assets/webm/**/*
  - assets/fonts/**/*
  - assets/pic/**/*
  - assets/memes/**/*
  - assets/config.jsonc
  - assets/logo.png
  - package.json
  - '!node_modules/**'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/logo.png
  # 与免安装包统一命名：dsh-pet-<版本>-<平台>-<架构>-<类型>.<ext>
  artifactName: dsh-pet-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: dsh-pet
  # 卸载时连数据一起删：数据就在安装目录里，本来也会被删；显式声明避免残留
  deleteAppDataOnUninstall: true
