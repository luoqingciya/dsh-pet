name: build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: dsh-pet

jobs:
  # 质量门禁：类型、规范、单测、产物结构、接口文档对齐
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-pet/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: node scripts/prepack-check.js
      - run: npm run check:openapi

  # 三平台便携版：拷一份对应平台的 Electron 运行时 + resources/app
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: win-x64
          - os: macos-latest
            suffix: mac-arm64
          - os: ubuntu-latest
            suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-pet/package-lock.json
      - run: npm ci
      - run: npm run build
      # 下 Electron 运行时。**不用 `npm i electron`**：那个包的 postinstall 在 CI 里会被跳过
      # （实测 "added 3 packages in 1s"，dist/ 根本没下载），于是打包步骤找不到运行时。
      # 走应用自己的 ensure-electron（@electron/get + SHA256 校验），与用户首次启动同一条路径。
      - name: Download Electron runtime
        env:
          DSH_PET_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run ensure:electron
      - name: Package
        run: node scripts/package-app.mjs
      # Windows 额外产一个安装版（NSIS，per-user 安装，数据同样落在安装目录）
      - name: Installer (Windows only)
        if: runner.os == 'Windows'
        env:
          # Runner 在 GitHub 网络内，直接走官方源（脚本默认的 npmmirror 是给国内本地构建用的）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run app:installer
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/dsh-pet-app/* -DestinationPath dist/dsh-pet-${{ matrix.suffix }}.zip
      - name: Archive (macOS / Linux)
        if: runner.os != 'Windows'
        run: cd dist && zip -qry dsh-pet-${{ matrix.suffix }}.zip dsh-pet-app
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-${{ matrix.suffix }}
          path: dsh-pet/dist/dsh-pet-*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: dsh-pet-installer
          path: dsh-pet/dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14

  # 打 tag 时把三平台产物挂到 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-pet-*.zip
            dist/*.exe
          generate_release_notes: true
          draft: false
