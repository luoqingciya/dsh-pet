name: build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 质量门禁：类型、规范、单测、产物结构、接口文档对齐
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: node scripts/prepack-check.js
      - run: npm run check:openapi

  # 真机 UI 回归：托盘菜单、桌面窗口、设置页下拉这些**只有真的开窗口**才抓得到的问题
  # （0.8.0 的"右键托盘没反应"、0.9.0 的"下拉字太小"都只有这一层能发现）。
  # 只在 Windows 上跑：runner 有桌面会话，Electron 能真的建窗口、截图。
  ui:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # 与打包步骤同一条下载路径（@electron/get + SHA256 校验）；下完 test:ui 自己会找到它
      - name: Download Electron runtime
        env:
          DSH_PET_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run ensure:electron
      - run: npm run test:ui

  # 三平台便携版：拷一份对应平台的 Electron 运行时 + resources/app
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: win-x64
          - os: macos-latest
            suffix: mac-arm64
          - os: ubuntu-latest
            suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # 产物文件名带版本号（dsh-pet-ng-<版本>-<平台>-<架构>.zip），方便归档与区分新旧包
      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"
      # 下 Electron 运行时。**不用 `npm i electron`**：那个包的 postinstall 在 CI 里会被跳过
      # （实测 "added 3 packages in 1s"，dist/ 根本没下载），于是打包步骤找不到运行时。
      # 走应用自己的 ensure-electron（@electron/get + SHA256 校验），与用户首次启动同一条路径。
      - name: Download Electron runtime
        env:
          DSH_PET_ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run ensure:electron
      - name: Package
        env:
          # Windows 上这一步会调 electron-builder --dir（为了把图标与版本信息写进 exe），
          # 它要下 NSIS/7zip 工具包；runner 在 GitHub 网络内，直接走官方源。
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: node scripts/package-app.mjs
      # Windows 额外产一个安装版（NSIS，per-user 安装，数据同样落在安装目录）
      - name: Installer (Windows only)
        if: runner.os == 'Windows'
        env:
          # Runner 在 GitHub 网络内，直接走官方源（脚本默认的 npmmirror 是给国内本地构建用的）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run app:installer
      # 两个平台都打成「一个 dsh-petNG/ 目录」：Windows 的 Compress-Archive 传 `*` 会把 20 个文件
      # 摊在压缩包根目录，解压后散一地；和 mac/linux 的包结构也不一致。
      #
      # 用 **改名而不是复制**：macOS 的 Electron.app 里全是符号链接（Framework 的 Versions/Current
      # 等），`cp -r` 会把它们解引用成真实文件——实测 zip 从 184MB 涨到 403MB。改名不动内容，
      # 链接原样保留，zip -y 才能正确存成链接。
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item -Path dist/dsh-pet-ng-app -NewName dsh-petNG
          Compress-Archive -Path dist/dsh-petNG -DestinationPath dist/dsh-pet-ng-${{ steps.ver.outputs.v }}-${{ matrix.suffix }}.zip
      - name: Archive (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          mv dsh-pet-ng-app dsh-petNG
          zip -qry dsh-pet-ng-${{ steps.ver.outputs.v }}-${{ matrix.suffix }}.zip dsh-petNG
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-ng-${{ matrix.suffix }}
          path: dist/dsh-pet-ng-*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: dsh-pet-ng-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14

  # 打 tag 时把三平台产物挂到 Release（真机 UI 也得绿，否则不发）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-pet-ng-*.zip
            dist/*.exe
          generate_release_notes: true
          draft: false
