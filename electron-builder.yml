# electron-builder 配置 —— 只用来产出 Windows 安装版（NSIS）
#
# 免安装版不走这里：`scripts/package-app.mjs` 直接拷一份 Electron 运行时即可（更快、更可控）。
# 这里之所以引入 electron-builder，是因为 NSIS 安装包（向导、开始菜单、卸载项、per-user 安装）
# 自己实现不划算。
#
# 关键取舍：
#   - `asar: false`：桌面窗口层是按**文件路径 require** 的（`src/desktop/windows.js`），
#     它又用 `loadFile(path.join(__dirname,'index.html'))` 读页面；打进 asar 后这两条路径的语义都会变。
#     不压缩换取"路径就是路径"，也方便用户直接看到运行时文件。
#   - `perMachine: false`：装到 `%LOCALAPPDATA%\Programs\dsh-petNG`，当前用户可写 ——
#     应用的配置/素材/日志就落在 `<安装目录>/data`（见 src/main/main.ts 的 resolveDataRoot）。
#     装到 Program Files 会因不可写而回落用户目录，就不是"数据都在安装目录下"了。
#   - 只发 x64：与 CI 的便携版一致；arm64 等有人需要再加。
appId: cn.luoqingciya.dshpetng
productName: dsh-petNG
copyright: MIT

# 与 scripts/package-app.mjs 用的是同一份 Electron；版本必须显式声明（本包不把 electron 当依赖装）
electronVersion: 43.3.0

asar: false
directories:
  output: dist/installer

# 只保留中文与英文语言包：Electron 默认带 55 个 locale（47MB），
# 一个中文桌宠只需要 zh-CN + en-US，裁剪后省 ~45MB。
electronLanguages:
  - zh-CN
  - en-US

# 只打运行必需的文件（与 scripts/package-app.mjs 的 APP_DIRS/APP_FILES **必须一致**）
# node_modules 明确排除：主进程与设置页都已被打包成单文件，运行时不需要任何 npm 依赖
# （启动器才需要 @electron/get，而安装版根本不经过启动器）。
#
# ⚠️ 这份清单与 package-app.mjs 是**两份手写清单**，很容易漂移：
# 1.0.1 就是这样发出去的——B2 把窗口层从 runtime/ 搬到 src/desktop/，package-app.mjs 跟着改了，
# 这里没改 → 免安装 zip 正常、**安装版启动即崩**（Cannot find module .../src/desktop/windows.js）。
# 现在 prepack-check 第 10 项会比对两份清单，漂移直接判红。
files:
  - lib/**/*
  # 窗口层按**文件路径** require（见上面 asar: false 的说明）：src/desktop/windows.js + 它
  # 同目录的 pointer-target / topmost-watchdog / dpi-linearization / desktop-geometry / preload，
  # 以及两个页面（index.html / tray-menu.html）
  - src/desktop/**/*
  - assets/webm/**/*
  - assets/fonts/**/*
  - assets/pic/**/*
  - assets/memes/**/*
  - assets/config.jsonc
  - assets/logo.png
  - package.json
  - '!node_modules/**'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/logo.png
  # 与免安装包统一命名：dsh-pet-ng-<版本>-<平台>-<架构>-<类型>.<ext>
  artifactName: dsh-pet-ng-${version}-win-${arch}-setup.${ext}

nsis:
  # 升级时保住安装目录里 data/ 的用户数据（默认流程会把整个 $INSTDIR 删掉）。
  # 细节见 build/installer.nsh 的注释。
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: dsh-petNG
  # 卸载时连数据一起删：数据就在安装目录里，本来也会被删；显式声明避免残留
  deleteAppDataOnUninstall: true
